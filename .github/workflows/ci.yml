# =============================================================================
# CI Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
#   lint ──┐
#          ├──> test ──> build
#   type ──┘
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ===========================================================================
  # Linting
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 black==23.12.1 isort==5.13.2

      - name: Run flake8
        run: flake8 app/ tests/ scripts/ --max-line-length=100 --exclude=__pycache__

      - name: Check black formatting
        run: black --check --diff app/ tests/ scripts/

      - name: Check import sorting
        run: isort --check-only --diff app/ tests/ scripts/

  # ===========================================================================
  # Type checking
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.8.0 types-requests

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  # ===========================================================================
  # Tests (unit, integration, data, model) with an 80% coverage gate
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache MovieLens dataset
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: movielens-100k

      - name: Train model
        run: echo y | python scripts/train_model.py

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: svd-model
          path: models/svd_model.pkl
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Docker build + smoke test
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: svd-model
          path: models/

      - name: Build Docker image
        run: docker build -t movie-rating-api:test .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name test-api movie-rating-api:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "API is up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"196","movie_id":"242"}' | grep -q predicted_rating
          docker logs test-api
          docker stop test-api
