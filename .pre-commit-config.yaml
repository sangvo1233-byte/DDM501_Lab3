# =============================================================================
# Pre-commit hooks configuration
# DDM501 - Lab 3: Testing & CI/CD
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
# =============================================================================
repos:
  # Standard hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Formatter
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: ['--line-length=100']

  # Import sorting (black-compatible profile)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # Linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--exclude=__pycache__,venv,.venv']

  # Type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^app/
        additional_dependencies:
          - types-requests
          - pydantic==2.5.2
        args: ['--ignore-missing-imports']

  # Fast unit tests before every commit
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: pytest tests/unit/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
